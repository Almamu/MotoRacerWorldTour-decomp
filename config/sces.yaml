# splat config for SCES_030.37, the boot executable (see docs/decomp.md).
name: SCES_030.37
sha1: 83e20568a179d5a066c1535b79acd0ce458b9144
options:
  basename: sces
  target_path: extracted/disc/SCES_030.37
  elf_path: build/sces.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/sces
  src_path: src/sces
  asset_path: assets/sces
  build_path: build/sces
  ld_script_path: build/sces.ld
  ld_dependencies: True
  create_asm_dependencies: True

  find_file_boundaries: True
  gp_value: 0x801C0A54
  ld_gp_expression: "0x801C0A54"

  o_as_suffix: True
  use_legacy_include_asm: False
  migrate_rodata_to_functions: True

  section_order: [".text", ".rodata", ".data", ".bss"]
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: True

  symbol_addrs_path:
    - config/sces/symbol_addrs.txt
  undefined_funcs_auto_path: build/sces/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/sces/undefined_syms_auto.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack
  # include/include_asm.h is ours (it takes C++ names with dots)
  generate_asm_macros_files: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80133334
    subsegments:
      # Code in chunks of about 8 KB (docs/decomp.md, "Chunks"): chunk_* is
      # the boot code, lib_* the libraries from the startup code on.
      - [0x800, c, chunk_00] # 80133334
      - [0x24F0, c, chunk_01] # 80135024
      - [0x4018, c, lib_00] # 80136B4C
      - [0x5F14, c, lib_01] # 80138A48
      - [0x8048, c, lib_02] # 8013AB7C
      - [0x9CD8, c, lib_03] # 8013C80C
      - [0xBCC0, c, lib_04] # 8013E7F4
      - [0xDC18, c, lib_05] # 8014074C
      - [0xFB08, c, lib_06] # 8014263C
      - [0x11A6C, c, lib_07] # 801445A0
      - [0x13734, c, lib_08] # 80146268
      - [0x157E4, c, lib_09] # 80148318
      - [0x177B4, c, lib_10] # 8014A2E8
      # .rodata, each piece with the chunk whose functions use it
      - [0x196F8, .rodata, chunk_00] # 8014C22C
      - [0x19864, .rodata, chunk_01] # 8014C398
      - [0x198BC, .rodata, lib_00] # 8014C3F0
      - [0x19B4C, .rodata, lib_01] # 8014C680
      - [0x19D8C, .rodata, lib_02] # 8014C8C0
      - [0x1A114, .rodata, lib_03] # 8014CC48
      - [0x1A16C, .rodata, lib_04] # 8014CCA0
      - [0x1A18C, .rodata, lib_06] # 8014CCC0
      - [0x1A21C, .rodata, lib_07] # 8014CD50
      - [0x1A23C, .rodata, lib_08] # 8014CD70
      - [0x1A27C, .rodata, lib_10] # 8014CDB0
      - [0x1A58C, data, data] # 8014D0C0
  - [0x8E000]
