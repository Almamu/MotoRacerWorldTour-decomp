# splat config for data\LANGIMG.DAT, the game code (see docs/decomp.md).
# The file is a 16-byte header followed by the image loaded at 0x80011800.
name: LANGIMG.DAT
sha1: b773b2906d3407bf0eabfb640d785061918badbe
options:
  basename: langimg
  target_path: extracted/mr3dat/data/LANGIMG.DAT
  elf_path: build/langimg.elf
  base_path: ..
  platform: psx
  compiler: PSYQ

  asm_path: asm/langimg
  src_path: src/langimg
  asset_path: assets/langimg
  build_path: build/langimg
  # splat's outputs for the link are tracked (linker/), so the build needs no
  # copy of the game; make re-splits when the game files are in extracted/
  ld_script_path: linker/langimg.ld
  ld_dependencies: False
  # C files are written by hand (src/, lib/), never generated: a chunk moved
  # to lib/ mustn't come back as a stub in src/.
  create_c_files: False
  create_asm_dependencies: True

  find_file_boundaries: True
  gp_value: 0x800C46F0
  ld_gp_expression: "0x800C46F0"

  o_as_suffix: True
  use_legacy_include_asm: False
  migrate_rodata_to_functions: True

  section_order: [".text", ".rodata", ".data", ".bss"]
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: True

  symbol_addrs_path:
    - config/langimg/symbol_addrs.txt
  undefined_funcs_auto_path: linker/langimg/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/langimg/undefined_syms_auto.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  include_asm_macro_style: maspsx_hack
  # include/include_asm.h is ours (it takes C++ names with dots)
  generate_asm_macros_files: False

segments:
  - [0x0, bin, header] # entry point, load address, size, unused word
  - name: main
    type: code
    start: 0x10
    vram: 0x80011800
    bss_size: 0x14868 # 0x800C9F48-0x800DE7B0, cleared by the entry point
    subsegments:
      - [0x10, textbin, text_table] # 8 words of data at the start of .text
      # Code in chunks of about 8 KB (docs/decomp.md, "Chunks"): chunk_* is
      # the game, lib_* the libraries from the startup code on.
      - [0x30, cpp, chunk_00] # 80011820
      - [0x1F74, cpp, chunk_01] # 80013764
      - [0x3FA8, cpp, chunk_02] # 80015798
