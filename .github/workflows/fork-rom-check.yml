# The full check for pull requests from forks, which build.yml can't run
# (forks get no secrets). `pull_request_target` runs this file as it is on
# main, so a PR can change the code that gets built but not this job.
#
# It builds the fork's code with access to the original executables, so it
# waits in the `fork-pr-rom` environment until a maintainer approves the
# run. Before approving, review the PR's changes to the Makefile, tools/
# and anything else the build runs.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  fork-rom-check:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    name: Build and compare (fork PR, needs approval)
    environment: fork-pr-rom
    env:
      CROSS: mipsel-linux-gnu-
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
        submodules: true

    # The checksums come from main: a PR that edits them can't pass itself.
    - name: Take the checksums from main
      run: curl -fsS -o "$RUNNER_TEMP/checksums.sha1" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}/config/checksums.sha1"

    - name: Install dependencies
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends binutils-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Python packages
      run: pip install -r requirements.txt

    - name: Fetch the compilers
      run: make setup

    - name: Fetch the original executables
      env:
        BASEROM_URL: ${{ secrets.BASEROM_URL }}
        BASEROM_USERNAME: ${{ secrets.BASEROM_USERNAME }}
        BASEROM_PASSWORD: ${{ secrets.BASEROM_PASSWORD }}
      run: |
        auth=()
        if [ -n "$BASEROM_USERNAME" ]; then auth=(-u "$BASEROM_USERNAME:$BASEROM_PASSWORD"); fi
        curl -fsSL "${auth[@]}" -o "$RUNNER_TEMP/baserom.tar.gz" "$BASEROM_URL"
        tools/baserom.sh unpack "$RUNNER_TEMP/baserom.tar.gz"

    - name: Build
      run: |
        make -j"$(nproc)" split
        make -j"$(nproc)" build

    - name: Compare with main's checksums
      run: sha1sum -c "$RUNNER_TEMP/checksums.sha1"

    - name: Build with NON_MATCHING=1
      run: make -j"$(nproc)" NON_MATCHING=1 build
